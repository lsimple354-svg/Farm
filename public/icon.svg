<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183D29"/>
      <stop offset="100%" stop-color="#0E2317"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Sprout iconography -->
  <!-- Soil mound -->
  <path d="M140 400 Q256 360 372 400 C340 430 172 430 140 400 Z" fill="#D97706" opacity="0.8"/>
  
  <!-- Main stem -->
  <path d="M256 390 C256 300 252 230 256 180" stroke="url(#stem)" stroke-width="20" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M254 270 C190 270 140 220 150 160 C210 150 250 210 254 270 Z" fill="url(#leaf)"/>
  <path d="M254 270 Q200 220 150 160" stroke="#065F46" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Right leaf -->
  <path d="M256 220 C320 200 370 140 360 90 C300 90 260 160 256 220 Z" fill="url(#leaf)"/>
  <path d="M256 220 Q310 160 360 90" stroke="#065F46" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
